<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirect</title>
  <script>
    // Simple redirect to root + preserve path in hash
    const path = window.location.pathname;
    if (path !== '/' && path !== '/elevolt/') {
      window.location.replace(
        window.location.origin + '/elevolt/#' + path
      );
    }
  </script>
</head>
<body></body>
</html>
