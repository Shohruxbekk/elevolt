<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elevolt</title>
  <script>
    (function() {
      var path = window.location.pathname.replace(/^\/elevolt/, '');
      var hash = '#' + path + window.location.search;

      
      window.location.replace(
        window.location.origin + '/elevolt/' + hash
      );
    })();
  </script>
</head>
<body></body>
</html>
